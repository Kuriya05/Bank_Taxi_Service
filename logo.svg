<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" role="img" aria-label="Bank Taxi Service">
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <svg x="0" y="0" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="pin" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </radialGradient>
  </defs>

  <!-- หมุดแผนที่ (จุดหมายปลายทาง) -->
  <path d="M60 4C33.5 4 13 24 13 49.5 13 81 60 116 60 116s47-35 47-66.5C107 24 86.5 4 60 4Z" fill="url(#pin)"/>
  <!-- ประกายเงาบนหมุด -->
  <path d="M60 9C37 9 19 26.5 19 48.5c0 4 .6 7.8 1.8 11.4C26 37 41 24 60 24s34 13 39.2 35.9c1.2-3.6 1.8-7.4 1.8-11.4C101 26.5 83 9 60 9Z" fill="url(#gloss)"/>
  <!-- ประกายดาว -->
  <path d="M93 17l1.6 4.4L99 23l-4.4 1.6L93 29l-1.6-4.4L87 23l4.4-1.6Z" fill="#fff" opacity=".9"/>

  <!-- หน้าปัดวงกลม -->
  <circle cx="60" cy="50" r="33" fill="url(#face)"/>
  <circle cx="60" cy="50" r="33" fill="none" stroke="#bae6fd" stroke-width="1.5"/>

  <!-- เส้นความเร็ว -->
  <g stroke="#38bdf8" stroke-linecap="round">
    <path d="M27 47h7" stroke-width="2.6"/>
    <path d="M24 52.5h9" stroke-width="2.6" stroke-opacity=".75"/>
    <path d="M28 58h5" stroke-width="2.6" stroke-opacity=".5"/>
  </g>

  <!-- ป้าย TAXI บนหลังคา -->
  <rect x="58.5" y="33.5" width="11" height="4.6" rx="1.6" fill="#06b6d4"/>
  <!-- ตัวรถ (มุมข้าง) -->
  <path d="M37 57.5v-4.6c0-2.2 1.4-3.6 3.5-4l6.5-1.3 6.2-6.4c1.3-1.3 3-2 4.8-2h12.6c1.9 0 3.6.8 4.8 2.2l5.2 6 4 .9c2.2.5 3.4 2 3.4 4.2v5c0 1.6-1.3 2.8-2.8 2.8H39.8c-1.6 0-2.8-1.2-2.8-2.8Z" fill="url(#car)"/>
  <!-- กระจก -->
  <path d="M51.5 47l4.6-4.8c.5-.5 1.1-.7 1.8-.7h5.6V47Z" fill="#e0f2fe"/>
  <path d="M66 47v-5.5h4.9c.8 0 1.5.3 2 .9L77 47Z" fill="#e0f2fe"/>
  <!-- เส้นสะท้อนตัวถัง -->
  <path d="M42 52.5h40" stroke="#7dd3fc" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
  <!-- ไฟหน้า / ไฟท้าย -->
  <rect x="83" y="50.2" width="3.4" height="2.4" rx="1.2" fill="#fde68a"/>
  <rect x="37.4" y="50.4" width="2.4" height="2.2" rx="1" fill="#fca5a5"/>
  <!-- ล้อ -->
  <circle cx="47.5" cy="60" r="5.6" fill="#0f2a44"/>
  <circle cx="47.5" cy="60" r="2.2" fill="#e0f2fe"/>
  <circle cx="75.5" cy="60" r="5.6" fill="#0f2a44"/>
  <circle cx="75.5" cy="60" r="2.2" fill="#e0f2fe"/>

  <!-- ถนนโค้ง -->
  <path d="M33 70.5Q60 76 87 70.5" fill="none" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="7 5"/>
</svg>
  <text x="134" y="64" font-family="Kanit, 'Arial Black', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#0f2a44" letter-spacing="1">BANK <tspan fill="url(#word)">TAXI</tspan></text>
  <rect x="137" y="80" width="26" height="3" rx="1.5" fill="#38bdf8"/>
  <text x="171" y="88" font-family="Kanit, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#0369a1" letter-spacing="9">SERVICE</text>
</svg>
